
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUÍ Y ALLÁ | Percepción peatonal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Manrope,sans-serif}
#opening{position:relative;width:100%;height:100svh;min-height:500px;overflow:hidden;background:#050505;color:#fff}
#openingCanvas{position:absolute;inset:0;width:100%;height:100%}
.opening-title{position:absolute;top:50%;left:50%;width:90%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 1.8s ease;pointer-events:none}
.opening-title.show{opacity:1}
.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:3px;margin-bottom:25px;color:#aaa}
.opening-title h1{font-size:clamp(48px,10vw,132px);font-weight:800;line-height:.9;letter-spacing:-.085em;margin:0}
.opening-title p{font:11px 'DM Mono',monospace;letter-spacing:2px;line-height:2;color:#aaa;margin:30px auto 0}
.opening-bottom{position:absolute;bottom:30px;left:5vw;right:5vw;display:flex;justify-content:space-between;font:9px 'DM Mono',monospace;letter-spacing:1.5px;color:#888;opacity:0;transition:opacity 1s ease}
.opening-bottom.show{opacity:1}
@media(max-width:650px){
.opening-title{width:94%}
.opening-title h1{font-size:16vw}
.opening-bottom{left:20px;right:20px;font-size:8px}
}
</style>
</head>
<body>

<section id="opening">
<canvas id="openingCanvas"></canvas>

<div class="opening-title" id="openingTitle">
<div class="eyebrow">CIUDADES PUERTO / CHILE × ARGENTINA</div>
<h1>PERCEPCIÓN<br>PEATONAL</h1>
<p>VALPARAÍSO · BUENOS AIRES</p>
</div>

<div class="opening-bottom" id="openingBottom">
<span>AQUÍ / CHILE</span>
<span>ALLÁ / ARGENTINA</span>
</div>
</section>

<script>
const canvas=document.getElementById('openingCanvas');
const ctx=canvas.getContext('2d');

let W=0,H=0,DPR=1;
const start=performance.now();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function ease(t){
t=clamp(t,0,1);
return t*t*(3-2*t);
}

function smoother(t){
t=clamp(t,0,1);
return t*t*t*(t*(6*t-15)+10);
}

function resize(){
DPR=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;
H=window.innerHeight;
canvas.width=W*DPR;
canvas.height=H*DPR;
canvas.style.width=W+'px';
canvas.style.height=H+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener('resize',resize);
resize();

function stroke(x1,y1,x2,y2,width){
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.lineWidth=width;
ctx.lineCap='round';
ctx.lineJoin='round';
ctx.strokeStyle='#f5f5f2';
ctx.stroke();
}

function drawPerson(x,y,phase,lean,scale,pose=0){
ctx.save();
ctx.translate(x,y);
ctx.rotate(lean);
ctx.scale(scale,scale);

const swing=Math.sin(phase);
const legA=swing*19;
const legB=-swing*19;
const armA=-swing*13;
const armB=swing*13;

ctx.fillStyle='#f5f5f2';

ctx.beginPath();
ctx.arc(0,-108,14,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.roundRect(-13,-86,26,49,12);
ctx.fill();

if(pose<0.2){
stroke(-7,-41,-13+legA*.45,-21,10);
stroke(-13+legA*.45,-21,-18+legA,-2,9);
stroke(7,-41,13+legB*.45,-21,10);
stroke(13+legB*.45,-21,18+legB,-2,9);

stroke(-9,-78,-17+armA*.4,-59,9);
stroke(-17+armA*.4,-59,-19+armA,-46,8);
stroke(9,-78,17+armB*.4,-59,9);
stroke(17+armB*.4,-59,19+armB,-46,8);
}else{
const p=clamp(pose,0,1);

stroke(-7,-41,-17-p*9,-24+p*7,10);
stroke(-17-p*9,-24+p*7,-23-p*12,-4+p*5,9);

stroke(7,-41,17+p*10,-24+p*7,10);
stroke(17+p*10,-24+p*7,24+p*12,-5+p*5,9);

stroke(-9,-79,-27-p*10,-65-p*5,9);
stroke(-27-p*10,-65-p*5,-37-p*8,-51-p*8,8);

stroke(9,-79,27+p*10,-65-p*5,9);
stroke(27+p*10,-65-p*5,37+p*8,-51-p*8,8);
}

ctx.restore();
}

function drawStone(x,y,size,rotation){
ctx.save();
ctx.translate(x,y);
ctx.rotate(rotation);
ctx.fillStyle='#f5f5f2';

ctx.beginPath();
ctx.moveTo(-size,-2);
ctx.lineTo(-size*.55,-size*.7);
ctx.lineTo(size*.25,-size);
ctx.lineTo(size,-size*.3);
ctx.lineTo(size*.65,size*.35);
ctx.lineTo(-size*.45,size*.4);
ctx.closePath();
ctx.fill();

ctx.restore();
}

function drawCar(x,y,scale){
ctx.save();
ctx.translate(x,y);
ctx.scale(scale,scale);

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.moveTo(-78,-16);
ctx.quadraticCurveTo(-74,-32,-50,-35);
ctx.lineTo(-25,-55);
ctx.quadraticCurveTo(-17,-62,0,-62);
ctx.lineTo(35,-59);
ctx.quadraticCurveTo(51,-57,60,-35);
ctx.lineTo(78,-27);
ctx.quadraticCurveTo(86,-24,86,-13);
ctx.lineTo(86,-6);
ctx.quadraticCurveTo(86,0,76,0);
ctx.lineTo(-75,0);
ctx.quadraticCurveTo(-86,0,-86,-9);
ctx.lineTo(-86,-17);
ctx.closePath();
ctx.fill();

ctx.fillStyle='#050505';

ctx.beginPath();
ctx.moveTo(-20,-54);
ctx.lineTo(-2,-54);
ctx.lineTo(-1,-37);
ctx.lineTo(-44,-37);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.moveTo(7,-54);
ctx.lineTo(32,-52);
ctx.quadraticCurveTo(45,-50,52,-37);
ctx.lineTo(7,-37);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.arc(-50,0,13,0,Math.PI*2);
ctx.arc(50,0,13,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.arc(-50,0,5,0,Math.PI*2);
ctx.arc(50,0,5,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function drawFloor(ground,holeX,holeWidth,holeHeight){
ctx.save();

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.rect(0,ground,W,H-ground);
ctx.ellipse(holeX,ground,holeWidth,holeHeight,0,0,Math.PI*2);
ctx.fill('evenodd');

ctx.strokeStyle='#f5f5f2';
ctx.lineWidth=3;
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth,holeHeight,Math.PI,0);
ctx.stroke();

ctx.restore();
}

function drawOpening(now){
const t=(now-start)/1000;

ctx.clearRect(0,0,W,H);
ctx.fillStyle='#050505';
ctx.fillRect(0,0,W,H);

const ground=H*.77;
const scale=Math.min(2.45,Math.max(1.8,H/360));

const startX=W*.16;
const stoneX=W*.43;
const holeX=W*.79;
const holeWidth=Math.min(110,W*.15);
const holeHeight=31;

const stumbleAt=2.55;
const stumbleDuration=.55;
const carAt=3.7;
const carDuration=.85;
const recoveryAt=4.8;
const walkAgainAt=5.1;
const fallAt=7.35;
const fallDuration=1.5;

const stumble=ease((t-stumbleAt)/.2)*(1-ease((t-3.25)/.3));
const recoil=ease((t-3.75)/.12)*(1-ease((t-4.5)/.25));

let personX;
let personY=ground;
let lean=0;
let pose=0;
let phase=t*8;

const stumbleX=stoneX-70*scale;
const finalWalkX=holeX;

if(t<stumbleAt){
personX=startX+(stumbleX-startX)*ease(t/stumbleAt);
}else if(t<recoveryAt){
personX=stumbleX;
lean=stumble*.62-recoil*.25;
pose=Math.max(stumble,recoil);
phase=stumbleAt*8;
}else if(t<fallAt){
const walkProgress=ease((t-walkAgainAt)/(fallAt-walkAgainAt));
personX=stumbleX+(finalWalkX-stumbleX)*walkProgress;
lean=-recoil*.2;
pose=0;
phase=t*8;
}else{
const fall=smoother((t-fallAt)/fallDuration);
personX=holeX;
personY=ground+fall*390;
lean=fall*.12;
pose=fall;
phase=t*5;
}

const stoneFade=ease((t-stumbleAt)/.12);
if(t<stumbleAt+.2){
ctx.save();
ctx.globalAlpha=1-stoneFade;
drawStone(stoneX,ground-2,19,stumble*.6);
ctx.restore();
}

const carProgress=smoother((t-carAt)/carDuration);
if(t>carAt&&t<carAt+carDuration+.1){
const carX=W+250-carProgress*(W+520);
const carScale=Math.max(1.55,Math.min(2,H/400));
drawCar(carX,ground-3,carScale);
}

if(t>3.75&&t<4.45){
const flash=(1-ease((t-3.75)/.7))*.22;
ctx.fillStyle=`rgba(255,255,255,${flash})`;
ctx.fillRect(0,0,W,H);
}

drawFloor(ground,holeX,holeWidth,holeHeight);

if(t<fallAt){
drawPerson(personX,personY,phase,lean,scale,pose);
}else{
const fall=smoother((t-fallAt)/fallDuration);

ctx.save();
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth,holeHeight,0,0,Math.PI*2);
ctx.clip();

drawPerson(personX,personY,phase,lean,scale,pose);

ctx.restore();
}

if(t>fallAt+.25&&t<fallAt+fallDuration){
const depth=ease((t-fallAt-.25)/.8);
ctx.save();
ctx.globalAlpha=depth*.55;
ctx.fillStyle='#050505';
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth,holeHeight,0,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

const fade=ease((t-8.45)/.9);
if(fade>0){
ctx.fillStyle=`rgba(5,5,5,${fade})`;
ctx.fillRect(0,0,W,H);
}

if(t>9.35){
document.getElementById('openingTitle').classList.add('show');
document.getElementById('openingBottom').classList.add('show');
}

requestAnimationFrame(drawOpening);
}

requestAnimationFrame(drawOpening);
</script>

</body>
</html>
